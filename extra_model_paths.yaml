# base_path supports env vars (ComfyUI uses os.path.expandvars). Set WEIGHTS_ROOT_DIR when starting ComfyUI (e.g. /workspace/models).
comfyui:
    base_path: ${WEIGHTS_ROOT_DIR}/
    # You can use is_default to mark that these folders should be listed first, and used as the default dirs for eg downloads
    #is_default: true
    checkpoints: checkpoints/
    text_encoders: |
         text_encoders/
         clip/  # legacy location still supported
    clip_vision: clip_vision/
    configs: configs/
    controlnet: controlnet/
    diffusion_models: |
                 diffusion_models
                 unet
    embeddings: embeddings/
    loras: loras/
    upscale_models: upscale_
    vae: vae/
    audio_encoders: audio_encoders/
    model_patches: model_patches/